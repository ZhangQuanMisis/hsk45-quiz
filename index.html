<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3b2e7e">
<title>汉语闯关 · 综合课本5（第1—3课）</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; }
  body {
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC",system-ui,sans-serif;
    background:linear-gradient(165deg,#3b2e7e 0%,#5a45b0 45%,#8b5cd6 100%);
    background-attachment:fixed; color:#2b2440; min-height:100vh;
  }
  #app { max-width:520px; margin:0 auto; }
  .screen { min-height:100vh; padding:18px 16px calc(28px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; }
  .screen.center { align-items:center; justify-content:center; text-align:center; }

  /* 首页 */
  .logo { margin-bottom:10px; }
  .logo img { display:block; width:120px; height:120px; border-radius:50%; object-fit:cover; background:#fffdf6;
    box-shadow:0 10px 24px rgba(20,10,50,.35), 0 0 0 5px rgba(255,255,255,.5); transform:scale(1.12); }
  .title { font-size:34px; font-weight:900; color:#fff; letter-spacing:2px; margin:6px 0 4px; }
  .subtitle { color:#ded6ff; font-size:13.5px; line-height:1.7; }
  .btn { display:block; width:100%; border:none; border-radius:16px; padding:16px 18px; font-size:17px; font-weight:800;
    letter-spacing:1px; cursor:pointer; transition:transform .12s, filter .12s; font-family:inherit; }
  .btn:active { transform:scale(.975); }
  .btn-main { background:linear-gradient(135deg,#ff9a44,#fc6076); color:#fff; box-shadow:0 8px 20px rgba(252,96,118,.42); }
  .btn-sub { background:rgba(255,255,255,.94); color:#4a3a86; box-shadow:0 6px 16px rgba(30,15,60,.18); margin-top:10px; }
  .btn-ghost { background:rgba(255,255,255,.18); color:#fff; border:1.5px solid rgba(255,255,255,.4); margin-top:10px; }
  .btn-soft { background:#f4f0ff; color:#5a3ec8; border:1.5px solid #e4dcfb; margin-top:10px; }
  .btn:disabled { filter:grayscale(.5) brightness(.92); opacity:.65; }

  .rules { width:100%; max-width:360px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.18);
    border-radius:18px; padding:16px 18px; margin-top:22px; color:#fff; font-size:13.5px; line-height:1.85; text-align:left; }
  .rules b { color:#ffdf8e; }

  /* 关卡列表 */
  .head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .head h2 { color:#fff; font-size:19px; margin:0; }
  .pill { background:rgba(255,255,255,.9); color:#5a3ec8; font-weight:800; font-size:13px; padding:6px 12px; border-radius:20px; }
  .level-item { display:flex; align-items:center; gap:12px; background:#fff; border-radius:18px; padding:14px;
    margin-bottom:11px; box-shadow:0 6px 18px rgba(20,10,60,.16); cursor:pointer; }
  .level-item.locked { opacity:.55; }
  .li-emoji { font-size:26px; width:44px; height:44px; display:flex; align-items:center; justify-content:center;
    background:#f3efff; border-radius:14px; flex:none; }
  .li-name { flex:1; min-width:0; }
  .li-name b { display:block; font-size:15.5px; color:#33285c; }
  .li-name span { font-size:12px; color:#8b83a8; }
  .li-stars { font-size:13px; color:#f0b429; letter-spacing:1px; }

  /* 题目页 */
  .topbar { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .xbtn { width:34px; height:34px; border-radius:50%; border:none; background:rgba(255,255,255,.22); color:#fff;
    font-size:18px; line-height:1; cursor:pointer; flex:none; }
  .progress { flex:1; height:8px; background:rgba(255,255,255,.25); border-radius:6px; overflow:hidden; }
  .progress i { display:block; height:100%; background:linear-gradient(90deg,#ffd166,#ff8a3d); border-radius:6px; transition:width .3s; }
  .score-pill { background:rgba(255,255,255,.92); color:#5a3ec8; font-weight:800; font-size:12.5px; padding:5px 10px; border-radius:16px; flex:none; }
  .meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .lvl-tag { color:#fff; font-size:12.5px; background:rgba(255,255,255,.2); padding:4px 10px; border-radius:12px; }
  .hearts { font-size:14px; letter-spacing:2px; }
  .hearts .off { opacity:.28; }

  .qcard { background:#fff; border-radius:22px; padding:18px 16px 16px; box-shadow:0 10px 28px rgba(20,10,60,.22); }
  .qtype { display:inline-block; font-size:11.5px; font-weight:800; color:#7a5af8; background:#f1ecff;
    padding:3px 9px; border-radius:8px; margin-bottom:9px; letter-spacing:.5px; }
  .qtext { font-size:19px; font-weight:700; line-height:1.65; color:#2b2440; margin-bottom:14px; }
  .qtext em { font-style:normal; color:#e0578b; font-weight:900; }

  .opt { display:block; width:100%; text-align:left; background:#f7f5ff; border:2px solid #ece7fb; color:#2b2440;
    border-radius:14px; padding:13px 14px; font-size:16px; line-height:1.5; margin-bottom:9px;
    font-family:inherit; cursor:pointer; transition:.14s; }
  .opt:active { transform:scale(.99); }
  .opt.correct { background:#e7f9ef; border-color:#33c481; color:#15855a; font-weight:700; }
  .opt.wrong { background:#fdeceb; border-color:#f26d6d; color:#c0392b; }
  .opt.dim { opacity:.45; }

  /* 排序 */
  .pool, .chosen { min-height:52px; border-radius:14px; padding:8px; display:flex; flex-wrap:wrap; gap:7px; align-content:flex-start; }
  .pool { background:#f7f5ff; border:2px dashed #dcd4f7; }
  .chosen { background:#fffaf0; border:2px solid #ffe0b0; margin-bottom:10px; }
  .chip { background:#fff; border:2px solid #ded6f8; border-radius:11px; padding:9px 12px; font-size:16px;
    color:#33285c; font-family:inherit; cursor:pointer; box-shadow:0 2px 6px rgba(60,40,120,.1); }
  .chip.sent { font-size:14.5px; line-height:1.45; text-align:left; max-width:100%; }
  .chip.used { opacity:.25; pointer-events:none; }
  .hint { font-size:12.5px; color:#8b83a8; margin:0 0 8px; }

  /* 连线 */
  .mwrap { position:relative; display:flex; gap:30px; margin-top:6px; }
  .mlines { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; overflow:visible; }
  .mcol { flex:1; display:flex; flex-direction:column; gap:9px; z-index:2; }
  .mitem { background:#f7f5ff; border:2px solid #ece7fb; border-radius:12px; padding:11px 8px; font-size:14.5px;
    line-height:1.35; text-align:center; cursor:pointer; position:relative; transition:.14s; min-height:46px;
    display:flex; align-items:center; justify-content:center; color:#2b2440; font-family:inherit; }
  .mitem.sel { border-color:#7b68ee; background:#eee9ff; box-shadow:0 0 0 3px rgba(123,104,238,.18); }
  .mitem.paired { border-color:#b9a4ff; background:#f0ebff; }
  .mitem.ok { border-color:#33c481; background:#e7f9ef; color:#15855a; font-weight:700; }
  .mitem.bad { border-color:#f26d6d; background:#fdeceb; color:#c0392b; }
  .mitem .num { position:absolute; top:-7px; right:-6px; background:#7b68ee; color:#fff; font-size:10.5px;
    width:19px; height:19px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; }
  .mitem.ok .num { background:#33c481; }
  .mitem.bad .num { background:#f26d6d; }

  /* 阅读 */
  .timerbar { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .tpill { background:#fff3e0; color:#d97706; font-weight:900; font-size:14px; padding:6px 12px; border-radius:14px; }
  .tpill.done { background:#fdeceb; color:#c0392b; }
  .tprog { flex:1; height:7px; background:#eee9f8; border-radius:6px; overflow:hidden; }
  .tprog i { display:block; height:100%; background:linear-gradient(90deg,#34d399,#f59e0b); transition:width 1s linear; }
  .passage { background:#fffaf0; border:1.5px solid #f3e2c6; border-radius:16px; padding:14px; font-size:15.5px;
    line-height:1.95; color:#3a2f1c; text-indent:2em; }
  .passage.gone { background:#f4f2fa; border:1.5px dashed #cfc7e6; text-align:center; text-indent:0;
    color:#8b83a8; font-size:14px; line-height:1.7; padding:22px 14px; }
  .passage.gone b { display:block; font-size:16px; color:#6b5fa8; margin-bottom:4px; }
  .subq { margin-top:16px; padding-top:14px; border-top:1px dashed #e6e0f3; }
  .subq .num2 { font-size:12.5px; font-weight:800; color:#7a5af8; margin-bottom:6px; }
  .subq .st { font-size:16.5px; font-weight:700; line-height:1.6; margin-bottom:10px; }

  /* 反馈 */
  .fb { margin-top:14px; border-radius:15px; padding:13px 14px; font-size:14px; line-height:1.75; }
  .fb.ok { background:#e7f9ef; color:#147a52; }
  .fb.bad { background:#fdeceb; color:#a83228; }
  .fb b { display:block; font-size:15px; margin-bottom:4px; }
  .fb .k { display:block; margin-top:6px; color:#5c5478; }
  .combo { display:inline-flex; align-items:center; gap:5px; background:linear-gradient(135deg,#ffb75e,#ed6a5a);
    color:#fff; font-size:12px; font-weight:900; padding:4px 10px; border-radius:12px; margin-bottom:10px; }

  .bottom { margin-top:auto; padding-top:16px; }
  .hidden { display:none !important; }
  .toast { position:fixed; left:50%; bottom:34px; transform:translateX(-50%); background:rgba(30,20,60,.92);
    color:#fff; font-size:13.5px; padding:10px 18px; border-radius:20px; z-index:99; opacity:0; transition:.25s; pointer-events:none; }
  .toast.show { opacity:1; }

  /* 结算 */
  .res-card { background:#fff; border-radius:24px; padding:24px 20px; box-shadow:0 12px 34px rgba(20,10,60,.24); text-align:center; }
  .res-card h3 { margin:0 0 6px; font-size:22px; color:#33285c; }
  .big-stars { font-size:38px; letter-spacing:6px; color:#f0b429; margin:8px 0; }
  .big-stars .off { color:#e6ddf2; }
  .res-line { color:#6c6389; font-size:14px; margin:4px 0 18px; }
  .stat-row { display:flex; gap:10px; margin:16px 0 20px; }
  .stat { flex:1; background:#f7f5ff; border-radius:14px; padding:12px 6px; }
  .stat b { display:block; font-size:20px; color:#5a3ec8; }
  .stat span { font-size:11.5px; color:#918aa9; }
  #certCanvas { width:100%; max-width:520px; border-radius:16px; display:block; box-shadow:0 10px 30px rgba(20,10,60,.3); }
  input.name { width:100%; border:2px solid #e6e0f3; border-radius:14px; padding:13px 14px; font-size:16px;
    font-family:inherit; margin-bottom:10px; outline:none; }
  input.name:focus { border-color:#9b83ff; }
</style>
</head>

/* ================= 工具 ================= */
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1500);
}
function save(){
  try{ localStorage.setItem('hsk45', JSON.stringify({stars:S.stars, name:S.name})); }catch(e){}
}
function starTotal(){ return Object.values(S.stars).reduce((a,b)=>a+b,0); }
function clearTimer(){ if(S.timer){ clearInterval(S.timer); S.timer=null; } }
function shuffleArr(a){ const x=a.slice(); for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; }
// 组句题：随机打乱词块显示顺序，并确保不会直接摆出正确答案
function makeChipOrder(q){
  const items = q.type==='sort' ? q.items : q.words;
  const base = items.map((_,i)=>i);
  if(q.type!=='order') return base;
  const norm = s=>s.replace(/[，。、？！,.\?!\s]/g,'');
  const answers = [q.a, ...(q.alts||[])].map(norm);
  let arr = shuffleArr(base);
  for(let t=0;t<40;t++){
    const s = norm(arr.map(i=>items[i]).join(''));
    if(!answers.includes(s)) break;
    arr = shuffleArr(base);
  }
  return arr;
}
function heartHtml(){
  let s='';
  for(let i=0;i<3;i++) s += i<S.hearts ? '❤️' : '<span class="off">🖤</span>';
  return s;
}
function comboHtml(){
  if(S.combo<2) return '';
  return `<div class="combo">🔥 连对 ${S.combo} 题</div>`;
}

/* ================= 语音 ================= */
let VOICE=null, voiceReady=false;
function pickVoice(){
  if(!window.speechSynthesis) return;
  const vs = speechSynthesis.getVoices()||[];
  VOICE = vs.find(v=>/zh[-_]CN/i.test(v.lang) && /Ting|Xiao|Yun|Li|Mei|Hui|Kai|Ya/i.test(v.name))
       || vs.find(v=>/zh[-_]CN/i.test(v.lang))
       || vs.find(v=>/^zh/i.test(v.lang)) || null;
  voiceReady = vs.length>0;
}
if(window.speechSynthesis){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
const SPEECH_RATE = 0.66;   /* 听力语速：0.66 = 原来的 0.88 × 0.75，想再调就改这个数 */
function speak(text){
  if(!window.speechSynthesis){ toast('这台设备不支持语音朗读'); return false; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='zh-CN'; u.rate=SPEECH_RATE; u.pitch=1;
  if(VOICE) u.voice=VOICE;
  speechSynthesis.speak(u);
  return true;
}

/* ================= 题目渲染 ================= */
function renderQ(){
  clearTimer();
  if(window.speechSynthesis) speechSynthesis.cancel();
  const l=LEVELS[S.level], q=l.qs[S.qi];
  S.answered=false; S.chosen=[]; S.pairs={}; S.selL=null; S.matchDone=false;
  S.readSel=[]; S.readDone=false; S.listenLeft=2;

  // 选择题/听力：选项随机排序
  if(q.type==='mcq'||q.type==='listen') S.optOrder = shuffleArr(q.opts.map((_,i)=>i));
  // 组句题：词块随机打乱，且保证不会正好是答案顺序（句子排序题保持原顺序，因解析按编号指代）
  if(q.type==='order') S.chipOrder = makeChipOrder(q);
  // 阅读题内的子题也各自打乱
  if(q.type==='read') S.readOrder = q.qs.map(s=>shuffleArr(s.opts.map((_,i)=>i)));

  const totalQ = l.qs.length;
  let body='';
  if(q.type==='mcq') body = optBlock(q, S.optOrder, 'pickOpt');
  if(q.type==='listen') body = listenBlock(q);
  if(q.type==='order'||q.type==='sort') body = orderBlock(q);
  if(q.type==='match') body = matchBlock(q);
  if(q.type==='read') body = readBlock(q);

  const typeName = {mcq:'选择题',order:'排序题',sort:'排序题',match:'连线题',listen:'听力题',read:'阅读题'}[q.type];
  $app.innerHTML = `
  <div class="screen">
    <div class="topbar">
      <button class="xbtn" onclick="quitLevel()">✕</button>
      <div class="progress"><i style="width:${(S.qi/totalQ)*100}%"></i></div>
      <div class="score-pill">${S.score} 分</div>
    </div>
    <div class="meta">
      <span class="lvl-tag">${l.emoji} ${l.name}</span>
      <span class="hearts">${heartHtml()}</span>
    </div>
    <div class="qnum" style="color:#ded6ff;font-size:12.5px;margin-bottom:8px">第 ${S.qi+1} 题 / 共 ${totalQ} 题</div>
    ${comboHtml()}
    <div class="qcard">
      <span class="qtype">${typeName}</span>
      <div class="qtext">${q.q||''}</div>
      <div id="qbody">${body}</div>
      <div id="fb"></div>
    </div>
    <div class="bottom" id="bottom"></div>
  </div>`;
  if(q.type==='listen') setTimeout(()=>playListen(), 350);
  if(q.type==='match') setTimeout(drawLines, 60);
  if(q.type==='read') setTimeout(()=>startReadTimer(q.sec), 150);
}

function optBlock(q, order, handler){
  return `<div id="opts">${order.map((orig,disp)=>{
    const n = ['A','B','C','D'][disp];
    return `<button class="opt" data-disp="${disp}" onclick="${handler}(this,${disp},${orig})">${n}. ${q.opts[orig]}</button>`;
  }).join('')}</div>`;
}

function listenBlock(q){
  return `
  <button class="btn btn-main" style="margin-bottom:12px" onclick="playListen()">🔊 听录音（还能听 <span id="lleft">${S.listenLeft}</span> 遍）</button>
  <div style="height:6px"></div>
  ${optBlock(q, S.optOrder, 'pickOpt')}`;
}
function playListen(){
  const q=LEVELS[S.level].qs[S.qi];
  if(S.listenLeft<=0){ toast('这一题不能再听了'); return; }
  const ok = speak(q.speak);
  if(!ok) return;
  S.listenLeft--;
  const el=document.getElementById('lleft'); if(el) el.textContent=S.listenLeft;
  if(S.listenLeft<=0){
    const b=document.querySelector('#qbody > button'); if(b){ b.disabled=true; b.textContent='🔊 已听完'; }
  }
}

function orderBlock(q){
  const isSort = q.type==='sort';
  const items = isSort? q.items : q.words;
  const order = S.chipOrder || items.map((_,i)=>i);
  return `
  <div class="chosen" id="chosen"></div>
  <div class="hint">${isSort?'按顺序点击下面的句子':'点击下面的词语，组成一个句子'}（再点一次可以取消）</div>
  <div class="pool" id="pool">${order.map(i=>
    `<button class="chip${isSort?' sent':''}" id="chip${i}" onclick="tapChip(${i})">${items[i]}</button>`).join('')}</div>
  <div style="height:14px"></div>
  <button class="btn btn-main" id="checkBtn" onclick="checkOrder()" disabled>确认答案</button>`;
}
function tapChip(i){
  if(S.answered) return;
  const q=LEVELS[S.level].qs[S.qi];
  const idx=S.chosen.indexOf(i);
  if(idx>=0){ S.chosen.splice(idx,1); } else { S.chosen.push(i); }
  paintOrder();
}
function paintOrder(){
  const q=LEVELS[S.level].qs[S.qi];
  const items = q.type==='sort'? q.items : q.words;
  const ch=document.getElementById('chosen');
  ch.innerHTML = S.chosen.map(i=>`<button class="chip${q.type==='sort'?' sent':''}" onclick="tapChip(${i})">${items[i]}</button>`).join('');
  items.forEach((_,i)=>{
    const c=document.getElementById('chip'+i);
    if(c) c.classList.toggle('used', S.chosen.includes(i));
  });
  const btn=document.getElementById('checkBtn');
  if(btn) btn.disabled = S.chosen.length!==items.length;
}
function checkOrder(){
  const q=LEVELS[S.level].qs[S.qi];
  let ok=false, ansHtml='';
  if(q.type==='order'){
    const str = S.chosen.map(i=>q.words[i]).join('');
    const norm = s=>s.replace(/[，。、？！,.\?!\s]/g,'');
    ok = [q.a, ...(q.alts||[])].some(a=>norm(a)===norm(str));
    ansHtml = q.a;
  }else{
    ok = S.chosen.every((v,i)=>v===q.a[i]);
    ansHtml = q.a.map(i=>q.items[i]).join(' → ');
  }
  // 显示正确顺序
  document.querySelectorAll('#pool .chip').forEach(c=>c.classList.add('used'));
  judge(ok, ansHtml);
}

/* ---------- 连线 ---------- */
function matchBlock(q){
  return `
  <div class="mwrap" id="matchWrap">
    <svg class="mlines" id="mlines"></svg>
    <div class="mcol">${q.left.map((t,i)=>
      `<button class="mitem" id="L${i}" onclick="tapMatch('L',${i})">${t}</button>`).join('')}</div>
    <div class="mcol">${q.right.map((t,i)=>
      `<button class="mitem" id="R${i}" onclick="tapMatch('R',${i})">${t}</button>`).join('')}</div>
  </div>
  <div class="hint" style="margin-top:12px">先点左边一项，再点右边对应的一项，即可连线。全部连完后才会显示正确答案。</div>`;
}
function tapMatch(side, idx){
  if(S.matchDone) return;
  const q=LEVELS[S.level].qs[S.qi];
  const key = side==='L'? idx : null;
  if(side==='L'){
    if(S.pairs[idx]!==undefined){ delete S.pairs[idx]; paintMatch(); return; }
    S.selL = idx;
    paintMatch();
    return;
  }
  // 右侧
  if(S.selL===null){
    // 若这一项已被左边连过，则取消那条连线
    const owner = Object.keys(S.pairs).find(k=>S.pairs[k]===idx);
    if(owner!==undefined){ delete S.pairs[owner]; paintMatch(); return; }
    toast('请先点左边的一项');
    return;
  }
  // 右侧已被其他左侧占用 → 取消占用
  Object.keys(S.pairs).forEach(k=>{ if(S.pairs[k]===idx) delete S.pairs[k]; });
  S.pairs[S.selL]=idx;
  S.selL=null;
  paintMatch();
  if(Object.keys(S.pairs).length===q.left.length) setTimeout(()=>finishMatch(), 320);
}
function paintMatch(){
  const q=LEVELS[S.level].qs[S.qi];
  q.left.forEach((_,i)=>{
    const el=document.getElementById('L'+i); if(!el) return;
    el.className='mitem'+(S.pairs[i]!==undefined?' paired':'')+(S.selL===i?' sel':'')+(S.matchDone?(S.pairs[i]===q.a[i]?' ok':' bad'):'');
    let num=el.querySelector('.num'); if(num) num.remove();
    if(S.pairs[i]!==undefined){
      const n=Object.keys(S.pairs).indexOf(String(i))+1;
      el.insertAdjacentHTML('beforeend', `<span class="num">${n}</span>`);
    }
  });
  const used={};
  Object.values(S.pairs).forEach((v,k)=>{ used[v]=Object.keys(S.pairs).indexOf(String(Object.keys(S.pairs)[k]))+1; });
  q.right.forEach((_,i)=>{
    const el=document.getElementById('R'+i); if(!el) return;
    let cls='mitem';
    const owner=Object.keys(S.pairs).find(k=>S.pairs[k]===i);
    if(owner!==undefined) cls+=' paired';
    if(S.matchDone){
      const correctFor = q.a.findIndex(v=>v===i);
      cls += (S.pairs[correctFor]===i)? ' ok':' bad';
    }
    el.className=cls;
    let num=el.querySelector('.num'); if(num) num.remove();
    if(owner!==undefined){
      const n=Object.keys(S.pairs).indexOf(owner)+1;
      el.insertAdjacentHTML('beforeend', `<span class="num">${n}</span>`);
    }
  });
  drawLines();
}
function finishMatch(){
  const q=LEVELS[S.level].qs[S.qi];
  S.matchDone=true;
  paintMatch();
  let right=0;
  q.left.forEach((_,i)=>{ if(S.pairs[i]===q.a[i]) right++; });
  const ok = right===q.left.length;
  judge(ok, null, `本关连对 ${right} / ${q.left.length} 组`);
}
function drawLines(){
  const wrap=document.getElementById('matchWrap'); if(!wrap) return;
  const svg=document.getElementById('mlines'); if(!svg) return;
  const r=wrap.getBoundingClientRect();
  if(!r.width) return;
  svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);
  svg.setAttribute('width', r.width); svg.setAttribute('height', r.height);
  const q=LEVELS[S.level].qs[S.qi];
  let html='';
  Object.keys(S.pairs).forEach(k=>{
    const L=document.getElementById('L'+k), R=document.getElementById('R'+S.pairs[k]);
    if(!L||!R) return;
    const a=L.getBoundingClientRect(), b=R.getBoundingClientRect();
    const x1=a.right-r.left-2, y1=a.top-r.top+a.height/2;
    const x2=b.left-r.left+2, y2=b.top-r.top+b.height/2;
    const col = S.matchDone ? (S.pairs[k]===q.a[Number(k)]?'#33c481':'#f26d6d') : '#7b68ee';
    html += `<path d="M${x1},${y1} C${x1+22},${y1} ${x2-22},${y2} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" opacity=".9"/>`
          + `<circle cx="${x1}" cy="${y1}" r="4" fill="${col}"/><circle cx="${x2}" cy="${y2}" r="4" fill="${col}"/>`;
  });
  svg.innerHTML=html;
}

/* ---------- 阅读 ---------- */
function readBlock(q){
  return `
  <div class="timerbar">
    <span class="tpill" id="tpill">⏱ <span id="tsec">${q.sec}</span> 秒</span>
    <div class="tprog"><i id="tbar" style="width:100%"></i></div>
  </div>
  <div class="passage" id="passageBox">${q.passage}</div>
  <button class="btn btn-sub" id="readDoneBtn" style="margin-top:12px" onclick="finishReading()">✅ 我已经读完了，开始答题</button>
  <div style="height:6px"></div>
  <div id="subqs">${q.qs.map((s,si)=>`
    <div class="subq">
      <div class="num2">第 ${si+1} 题</div>
      <div class="st">${s.q}</div>
      ${S.readOrder[si].map((orig,disp)=>
        `<button class="opt" data-s="${si}" data-d="${disp}" data-orig="${orig}" onclick="pickRead(this,${si},${disp},${orig})">${['A','B','C','D'][disp]}. ${s.opts[orig]}</button>`).join('')}
    </div>`).join('')}</div>
  <div style="height:12px"></div>
  <button class="btn btn-main" id="readSubmit" onclick="submitRead()" disabled>提交答案</button>`;
}
function startReadTimer(sec){
  clearTimer();
  S.timeLeft=sec;
  const bar=document.getElementById('tbar');
  if(bar) bar.style.width='100%';
  S.timer=setInterval(()=>{
    S.timeLeft--;
    const el=document.getElementById('tsec'); if(el) el.textContent=Math.max(0,S.timeLeft);
    if(bar) bar.style.width=Math.max(0,(S.timeLeft/sec)*100)+'%';
    if(S.timeLeft<=0){ clearTimer(); hidePassage(true); }
  },1000);
}
function hidePassage(auto){
  const box=document.getElementById('passageBox'); if(!box) return;
  if(box.classList.contains('gone')) return;
  box.classList.add('gone');
  box.innerHTML = `<b>${auto?'⏰ 时间到，文章已隐藏':'文章已隐藏'}</b>请根据记忆完成下面的题目`;
  const btn=document.getElementById('readDoneBtn'); if(btn) btn.remove();
  const pill=document.getElementById('tpill'); if(pill) pill.classList.add('done');
  const bar=document.getElementById('tbar'); if(bar) bar.style.width='0%';
}
function finishReading(){
  clearTimer();
  hidePassage(false);
}
function pickRead(el, si, disp, orig){
  if(S.readDone) return;
  const wrap=el.parentNode;
  wrap.querySelectorAll('.opt').forEach(o=>{ o.style.borderColor=''; o.style.background=''; });
  S.readSel[si]=orig;
  el.style.borderColor='#7b68ee'; el.style.background='#f0ecff';
  const q=LEVELS[S.level].qs[S.qi];
  const btn=document.getElementById('readSubmit');
  if(btn) btn.disabled = q.qs.some((_,i)=>S.readSel[i]===undefined);
}
function submitRead(){
  const q=LEVELS[S.level].qs[S.qi];
  clearTimer();
  S.readDone=true;
  let right=0;
  q.qs.forEach((s,si)=>{
    const chosen=S.readSel[si];
    const wrap=document.querySelectorAll('#subqs .subq')[si];
    wrap.querySelectorAll('.opt').forEach(o=>{
      const orig=Number(o.dataset.orig);
      o.style.borderColor=''; o.style.background='';
      o.disabled=true;
      if(orig===s.a) o.classList.add('correct');
      else if(orig===chosen) o.classList.add('wrong');
      else o.classList.add('dim');
    });
    if(chosen===s.a){
      right++; addScore(10);
      S.levelCorrect++; S.combo++; S.maxCombo=Math.max(S.maxCombo,S.combo);
    }else{
      S.combo=0; loseHeart();
    }
  });
  S.levelTotal += q.qs.length;
  const btn=document.getElementById('readSubmit'); if(btn) btn.remove();
  const okAll = right===q.qs.length;
  S.answered=true;
  const fb=document.getElementById('fb');
  fb.innerHTML = `<div class="fb ${okAll?'ok':'bad'}"><b>${okAll?'✅ 全部正确':'❌ 答对 '+right+' / '+q.qs.length+' 题'}</b>${q.ex?'<span class="k">💡 '+q.ex+'</span>':''}</div>`;
  if(S.hearts<=0){ setTimeout(()=>failLevel(),500); return; }
  nextButton();
}

/* ================= 判分 ================= */
function pickOpt(el, disp, orig){
  if(S.answered) return;
  const q=LEVELS[S.level].qs[S.qi];
  const wrap=document.getElementById('opts');
  wrap.querySelectorAll('.opt').forEach(o=>{ o.disabled=true; });
  [...wrap.querySelectorAll('.opt')].forEach(o=>{
    const d=Number(o.dataset.disp);
    const oIdx=S.optOrder[d];
    if(oIdx===q.a) o.classList.add('correct');
    else if(o===el) o.classList.add('wrong');
    else o.classList.add('dim');
  });
  judge(orig===q.a, q.opts[q.a]);
}

function addScore(n){
  S.score += n; S.levelScore += n;
  const p=document.querySelector('.score-pill'); if(p) p.textContent=S.score+' 分';
}
function loseHeart(){
  S.hearts = Math.max(0, S.hearts-1);
  const h=document.querySelector('.hearts'); if(h) h.innerHTML=heartHtml();
}
function judge(ok, ansHtml, extra){
  S.answered=true;
  S.levelTotal += 1;
  const q=LEVELS[S.level].qs[S.qi];
  if(ok){
    S.combo++; S.maxCombo=Math.max(S.maxCombo,S.combo);
    const bonus = Math.min(3, S.combo-1) * 2;
    addScore(10 + bonus);
    S.levelCorrect++;
  }else{
    S.combo=0;
    loseHeart();
  }
  const fb=document.getElementById('fb');
  let html=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'✅ 正确'+(S.combo>1?'  🔥 连对 '+S.combo+' 题':''):'❌ 答错了'}</b>`;
  if(!ok && ansHtml) html+=`<span class="k">正确答案：<b style="display:inline">${ansHtml}</b></span>`;
  if(extra) html+=`<span class="k">${extra}</span>`;
  if(q.ex) html+=`<span class="k">💡 ${q.ex}</span>`;
  html+=`</div>`;
  fb.innerHTML=html;
  if(S.hearts<=0){ setTimeout(()=>failLevel(),400); return; }
  nextButton();
}
function nextButton(){
  const isLast = S.qi>=LEVELS[S.level].qs.length-1;
  document.getElementById('bottom').innerHTML =
    `<button class="btn btn-main" onclick="${isLast?'levelResult()':'nextQ()'}">${isLast?'查看本关成绩 →':'下一题 →'}</button>`;
}
function nextQ(){ S.qi++; renderQ(); }

/* ================= 关卡结算 ================= */
function failLevel(){
  clearTimer();
  $app.innerHTML = `
  <div class="screen center">
    <div style="font-size:54px;margin-bottom:10px">💔</div>
    <div class="title" style="font-size:25px">红心用完了</div>
    <div class="subtitle" style="max-width:330px;margin:10px 0 26px">这一关要重新闯一次。别着急，先看看刚才答错的地方，再来！</div>
    <div style="width:100%;max-width:340px">
      <button class="btn btn-main" onclick="startLevel(${S.level})">🔁 重闯本关</button>
      <button class="btn btn-ghost" onclick="home()">← 返回首页</button>
    </div>
  </div>`;
}

function levelResult(){
  clearTimer();
  const l=LEVELS[S.level], total=l.qs.length;
  const rate = S.levelCorrect / Math.max(1,S.levelTotal);
  const st = rate>=0.95?3 : rate>=0.75?2 : rate>=0.5?1 : 0;
  if((S.stars[S.level]||0) < st){ S.stars[S.level]=st; save(); }
  const gotHearts = S.hearts;
  const isLast = S.level>=LEVELS.length-1;

  $app.innerHTML = `
  <div class="screen center">
    <div class="res-card" style="width:100%;max-width:360px">
      <h3>${l.emoji} ${l.name}</h3>
      <div class="big-stars">${'⭐'.repeat(st)}<span class="off">${'⭐'.repeat(3-st)}</span></div>
      <div class="res-line">正确率 ${Math.round(rate*100)}% ｜ 剩余 ${'❤️'.repeat(gotHearts)||'无'}</div>
      <div class="stat-row">
        <div class="stat"><b>${S.levelScore}</b><span>本关得分</span></div>
        <div class="stat"><b>${S.levelCorrect}/${S.levelTotal}</b><span>答对题数</span></div>
        <div class="stat"><b>${S.score}</b><span>总分</span></div>
      </div>
      ${st<3?`<div style="font-size:12.5px;color:#8b83a8;margin-bottom:14px">拿到 3 星可以再来挑战一次</div>`:''}
      ${isLast
        ? `<button class="btn btn-main" onclick="finalScreen()">🏅 领取闯关证书</button>`
        : `<button class="btn btn-main" onclick="levelIntro(${S.level+1})">▶ 进入下一关</button>`}
      <button class="btn btn-soft" onclick="startLevel(${S.level})">🔁 再闯本关</button>
      <button class="btn btn-soft" onclick="home()">🏠 返回首页</button>
    </div>
  </div>`;
}

function quitLevel(){
  if(confirm('要退出本关吗？本关成绩不会保存。')) home();
}

/* ================= 证书 ================= */
function rankFor(t){
  if(t>=14) return {t:'汉语大师', s:'👑'};
  if(t>=11) return {t:'汉语高手', s:'🥇'};
  if(t>=8)  return {t:'汉语能手', s:'🥈'};
  return {t:'汉语新星', s:'🌟'};
}

function finalScreen(){
  clearTimer();
  const total=starTotal(), r=rankFor(total);
  $app.innerHTML = `
  <div class="screen">
    <div class="head"><h2>闯关完成</h2><span class="pill">⭐ ${total}/15</span></div>
    <input class="name" id="nameInput" maxlength="12" placeholder="输入你的名字（会印在证书上）" value="${S.name||''}" oninput="redrawCert()">
    <canvas id="certCanvas"></canvas>
    <div class="bottom">
      <button class="btn btn-main" onclick="saveCert()">⬇ 保存证书图片</button>
      <button class="btn btn-ghost" onclick="home()">← 返回首页</button>
      <div style="color:#cfc6f5;font-size:12px;text-align:center;margin-top:12px">在手机上也可以长按证书图片保存到相册</div>
    </div>
  </div>`;
  redrawCert();
}

function redrawCert(){
  const inp=document.getElementById('nameInput');
  if(inp) S.name = inp.value.trim();
  const done = LEVELS.filter((l,i)=>S.stars[i]>0).length;
  drawCert(S.name||'同学', starTotal(), S.score, done);
}

function drawCert(name, total, score, done){
  const c=document.getElementById('certCanvas'); if(!c) return;
  const W=1080, H=1560; c.width=W; c.height=H;
  const x=c.getContext('2d');
  const FONT='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC",sans-serif';
  const f=(s,w)=>`${w||'normal'} ${s}px ${FONT}`;
  const cx=W/2;
  const rr=(l,t,w,h,r)=>{ x.beginPath(); x.moveTo(l+r,t); x.arcTo(l+w,t,l+w,t+h,r); x.arcTo(l+w,t+h,l,t+h,r); x.arcTo(l,t+h,l,t,r); x.arcTo(l,t,l+w,t,r); x.closePath(); };

  const bg=x.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#fdf7ea'); bg.addColorStop(.45,'#fffdf8'); bg.addColorStop(1,'#f9edd6');
  x.fillStyle=bg; x.fillRect(0,0,W,H);

  const blob=(px,py,r,col)=>{ const g=x.createRadialGradient(px,py,0,px,py,r); g.addColorStop(0,col); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,Math.PI*2); x.fill(); };
  blob(80,110,340,'rgba(124,92,214,.20)');
  blob(1010,250,330,'rgba(255,170,110,.26)');
  blob(990,1430,340,'rgba(90,180,240,.18)');
  blob(70,1370,320,'rgba(255,130,170,.20)');

  x.fillStyle='rgba(255,255,255,.55)'; rr(36,36,W-72,H-72,48); x.fill();
  x.strokeStyle='#e2bf6a'; x.lineWidth=9; rr(36,36,W-72,H-72,48); x.stroke();
  x.strokeStyle='rgba(226,191,106,.5)'; x.lineWidth=2.5; rr(64,64,W-128,H-128,34); x.stroke();
  [[100,100],[W-100,100],[100,H-100],[W-100,H-100]].forEach(p=>{ x.fillStyle='#e2bf6a'; x.beginPath(); x.arc(p[0],p[1],7,0,7); x.fill(); });

  x.textAlign='center'; x.textBaseline='alphabetic';
  x.fillStyle='#b08d55'; x.font=f(29); x.fillText('预科汉语强化教程 · 综合课本5 · 第一至三课',cx,150);
  x.fillStyle='#6a4bd0'; x.font=f(86,'bold'); x.fillText('汉 语 闯 关',cx,258);
  x.fillStyle='#b08d55'; x.font=f(30); x.fillText('闯 关 证 书',cx,314);
  x.strokeStyle='rgba(226,191,106,.8)'; x.lineWidth=3;
  x.beginPath(); x.moveTo(cx-170,350); x.lineTo(cx+170,350); x.stroke();
  x.fillStyle='#e2bf6a'; x.beginPath(); x.arc(cx,350,6,0,7); x.fill();

  // 熊猫
  const pd=186, pcy=452;
  x.save();
  x.beginPath(); x.arc(cx,pcy,pd/2,0,Math.PI*2); x.closePath();
  x.fillStyle='#fffdf6'; x.fill(); x.clip();
  if(pandaImg.complete && pandaImg.naturalWidth){
    const sc=Math.max(pd/pandaImg.naturalWidth, pd/pandaImg.naturalHeight)*1.22;
    const dw=pandaImg.naturalWidth*sc, dh=pandaImg.naturalHeight*sc;
    x.drawImage(pandaImg, cx-dw/2, pcy-dh/2, dw, dh);
  }else{
    x.textBaseline='middle'; x.font=f(116); x.fillStyle='#333'; x.fillText('🐼',cx,pcy); x.textBaseline='alphabetic';
    pandaImg.onload=()=>{ if(document.getElementById('certCanvas')) drawCert(name,total,score,done); };
  }
  x.restore();
  x.strokeStyle='#e2bf6a'; x.lineWidth=5; x.beginPath(); x.arc(cx,pcy,pd/2,0,Math.PI*2); x.stroke();
  x.strokeStyle='rgba(255,255,255,.92)'; x.lineWidth=2; x.beginPath(); x.arc(cx,pcy,pd/2-7,0,Math.PI*2); x.stroke();

  x.fillStyle='#9a8f7e'; x.font=f(27); x.fillText('兹证明',cx,588);

  const nm = name.length>10 ? name.slice(0,10)+'…' : name;
  let nf=94; if(nm.length>6) nf=74; if(nm.length>8) nf=62;
  x.font=f(nf,'bold'); x.fillStyle='#d4467a'; x.fillText(nm,cx,692);
  const nw = Math.min(W-280, x.measureText(nm).width+100);
  x.strokeStyle='rgba(212,70,122,.35)'; x.lineWidth=4;
  x.beginPath(); x.moveTo(cx-nw/2,720); x.lineTo(cx+nw/2,720); x.stroke();

  x.fillStyle='#8a7f9a'; x.font=f(26); x.fillText('已经完成「汉语闯关」全部关卡',cx,772);
  const sw=46, gp=4, s0=cx-(15*(sw+gp))/2;
  x.font=f(38,'bold'); x.textAlign='left';
  for(let i=0;i<15;i++){ x.fillStyle = i<total ? '#f0b429' : '#e6dcc8'; x.fillText('★', s0+i*(sw+gp), 838); }
  x.textAlign='center'; x.fillStyle='#b08d55'; x.font=f(28,'bold'); x.fillText(total+' / 15  ★',cx,888);

  const boxes=[['总分', score+' 分'],['星级', total+' / 15'],['通关', done+' / '+LEVELS.length]];
  const bw=286, bh=132, gb=26, tot=bw*3+gb*2, b0=cx-tot/2;
  boxes.forEach((b,i)=>{
    const bx=b0+i*(bw+gb), by=930;
    x.fillStyle='#fff'; rr(bx,by,bw,bh,22); x.fill();
    x.strokeStyle='rgba(124,92,214,.2)'; x.lineWidth=2; rr(bx,by,bw,bh,22); x.stroke();
    x.fillStyle='#a99fb8'; x.font=f(23); x.fillText(b[0], bx+bw/2, by+50);
    x.fillStyle='#6a4bd0'; x.font=f(40,'bold'); x.fillText(b[1], bx+bw/2, by+104);
  });

  const r=rankFor(total);
  const bandTop=1086, bandH=150;
  const tg=x.createLinearGradient(cx-390,0,cx+390,0);
  tg.addColorStop(0,'#7c5cd6'); tg.addColorStop(1,'#5b8def');
  x.fillStyle=tg; rr(cx-390,bandTop,780,bandH,28); x.fill();
  x.textAlign='center';
  let tf=52; x.font=f(tf,'bold');
  while(x.measureText(r.t+'  '+r.s).width>700 && tf>26){ tf-=2; x.font=f(tf,'bold'); }
  x.fillStyle='#fff'; x.fillText(r.t+'  '+r.s, cx, bandTop+94);

  // 三课名称（自动缩字，避免与印章相撞）
  const line='第1课 夜爬泰山　｜　第2课 一个好还是两个好　｜　第3课 便利店里的温柔';
  let lf=23; x.font=f(lf);
  while(x.measureText(line).width>720 && lf>15){ lf-=1; x.font=f(lf); }
  x.fillStyle='#a2957f'; x.fillText(line, cx, 1276);

  const d=new Date();
  x.textAlign='left'; x.fillStyle='#8a7f9a'; x.font=f(26);
  x.fillText(d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日', 150, 1412);
  x.strokeStyle='rgba(138,127,154,.5)'; x.lineWidth=2;
  x.beginPath(); x.moveTo(520,1420); x.lineTo(770,1420); x.stroke();
  x.fillStyle='#b0a6bb'; x.font=f(22); x.fillText('教师签名', 560, 1456);

  // 印章
  x.save();
  x.translate(884,1396); x.rotate(-.18);
  x.strokeStyle='#d4413c'; x.lineWidth=7; rr(-92,-80,184,160,18); x.stroke();
  x.fillStyle='#d4413c'; x.textAlign='center'; x.font=f(50,'bold');
  x.fillText('闯关', 0, -6); x.fillText('成功', 0, 58);
  x.restore();
  x.textAlign='center';
}

function saveCert(){
  const c=document.getElementById('certCanvas');
  if(!c) return;
  const a=document.createElement('a');
  a.download='汉语闯关证书_'+(S.name||'同学')+'.png';
  a.href=c.toDataURL('image/png');
  a.click();
  toast('已生成图片，可在相册中查看');
}

window.addEventListener('resize', ()=>{ if(document.getElementById('matchWrap')) drawLines(); });
window.addEventListener('orientationchange', ()=>{ setTimeout(()=>{ if(document.getElementById('matchWrap')) drawLines(); },300); });
window.addEventListener('load', ()=>{
  if(window.speechSynthesis) speechSynthesis.getVoices();
  home();
});
